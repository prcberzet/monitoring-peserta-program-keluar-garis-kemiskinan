const rupiah = (n) => "Rp " + Math.round(n || 0).toLocaleString("id-ID");
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
function initials(nama) {
  return (nama || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}

const STAGES = {
  baru: { label: "Baru Bergabung", step: 0, bg: "bg-stone-200", text: "text-stone-700", bar: "bg-stone-400" },
  mulai: { label: "Mulai Berusaha", step: 1, bg: "bg-amber-100", text: "text-amber-800", bar: "bg-amber-500" },
  berkembang: { label: "Berkembang", step: 2, bg: "bg-brand-100", text: "text-brand-800", bar: "bg-brand-500" },
  mandiri: { label: "Mandiri", step: 3, bg: "bg-emerald-100", text: "text-emerald-800", bar: "bg-emerald-600" },
};
const STAGE_ORDER = ["baru", "mulai", "berkembang", "mandiri"];

const JENIS_INTERVENSI = ["Kaki Palsu / Alat Bantu", "Bantuan Modal Usaha", "Pelatihan Usaha", "Pendampingan", "Lainnya"];

function sortedEntries(entries) {
  return [...(entries || [])].sort((a, b) => a.tanggal.localeCompare(b.tanggal));
}
function sortedDesc(entries) {
  return [...(entries || [])].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
}
function householdSize(p) { return (Number(p.jumlahTanggungan) || 0) + 1; }
function lastIncome(entries) {
  const s = sortedEntries(entries);
  return s.length ? Number(s[s.length - 1].jumlah) || 0 : 0;
}
function getStage(entries, p, povertyLine) {
  const s = sortedEntries(entries);
  if (s.length === 0) return "baru";
  const hh = householdSize(p);
  const last4 = s.slice(-4);
  const above = last4.every((e) => (Number(e.jumlah) || 0) / hh >= povertyLine);
  if (above) return "mandiri";
  if (s.length >= 2) {
    const first = Number(s[0].jumlah) || 0;
    const last = Number(s[s.length - 1].jumlah) || 0;
    if (last > first) return "berkembang";
  }
  return "mulai";
}
function getTrend(entries) {
  const s = sortedEntries(entries);
  if (s.length < 2) return { pct: null, dir: "flat" };
  const first = Number(s[0].jumlah) || 0;
  const last = Number(s[s.length - 1].jumlah) || 0;
  if (first === 0) return { pct: null, dir: last > 0 ? "up" : "flat" };
  const pct = ((last - first) / first) * 100;
  return { pct, dir: pct > 1 ? "up" : pct < -1 ? "down" : "flat" };
}

function icon(name, cls) { return `<span class="${cls}">${ICON[name]}</span>`; }

function stageBadge(stage, small) {
  const m = STAGES[stage];
  return `<span class="inline-flex items-center gap-1.5 rounded-full ${m.bg} ${m.text} font-semibold ${small ? "text-xs px-2.5 py-1" : "text-sm px-3 py-1.5"}">
    ${icon("award", small ? "w-3 h-3" : "w-3.5 h-3.5")} ${m.label}</span>`;
}
function stepTrack(stage) {
  const cur = STAGES[stage].step;
  return `<div class="flex items-center gap-1 w-full">${STAGE_ORDER.map((k, i) => {
    const filled = i <= cur;
    return `<div class="flex-1 flex items-center gap-1">
      <div class="h-1.5 flex-1 rounded-full ${filled ? STAGES[k].bar : "bg-stone-200"}"></div>
      ${i < STAGE_ORDER.length - 1 ? `<span class="w-2 h-2 rounded-full flex-shrink-0 ${filled ? "bg-brand-600" : "bg-stone-300"}"></span>` : ""}
    </div>`;
  }).join("")}</div>`;
}
function trendPill(trend) {
  if (trend.pct === null) return `<span class="inline-flex items-center gap-1 text-xs text-stone-500">${icon("minus", "w-3 h-3")} Belum cukup data</span>`;
  const up = trend.dir === "up", down = trend.dir === "down";
  const cls = up ? "text-emerald-700" : down ? "text-rose-600" : "text-stone-500";
  return `<span class="inline-flex items-center gap-1 text-xs font-mono font-semibold ${cls}">
    ${icon(up ? "up" : down ? "down" : "minus", "w-3.5 h-3.5")} ${trend.pct > 0 ? "+" : ""}${trend.pct.toFixed(0)}%</span>`;
}
function infoRow(iconName, label, value) {
  return `<div class="flex items-start gap-2.5 text-sm">
    <span class="w-4 h-4 text-brand-600 mt-0.5 flex-shrink-0">${ICON[iconName]}</span>
    <div class="min-w-0"><div class="text-[11px] uppercase tracking-wide text-stone-400 font-medium">${label}</div>
    <div class="text-stone-800 break-words">${value || "-"}</div></div></div>`;
}

/* =====================================================================
   3) FIRESTORE DATA LAYER (realtime)
   ===================================================================== */
function addIncomeEntry(nik, entry) {
  return db.collection("participants").doc(nik).collection("income").add(entry);
}
function saveParticipantDoc(nik, data) {
  return db.collection("participants").doc(nik).set(data, { merge: true });
}
async function deleteParticipantDoc(nik) {
  const ref = db.collection("participants").doc(nik);
  const [incomeSnap, interSnap] = await Promise.all([ref.collection("income").get(), ref.collection("interventions").get()]);
  const batch = db.batch();
  incomeSnap.docs.forEach((d) => batch.delete(d.ref));
  interSnap.docs.forEach((d) => batch.delete(d.ref));
  batch.delete(ref);
  return batch.commit();
}
function saveSettingsDoc(data) {
  return db.collection("settings").doc("general").set(data, { merge: true });
}
function addIntervention(nik, data) {
  return db.collection("participants").doc(nik).collection("interventions").add(data);
}
function deleteIntervention(nik, id) {
  return db.collection("participants").doc(nik).collection("interventions").doc(id).delete();
}

/* realtime subscription helpers */
let unsubs = [];
function clearSubs() { unsubs.forEach((u) => { try { u(); } catch (e) {} }); unsubs = []; }
function track(u) { unsubs.push(u); }

function subscribeParticipant(nik, cb) {
  return db.collection("participants").doc(nik).onSnapshot((doc) => cb(doc.exists ? doc.data() : null));
}
function subscribeIncome(nik, cb) {
  return db.collection("participants").doc(nik).collection("income").orderBy("tanggal")
    .onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
}
function subscribeInterventions(nik, cb) {
  return db.collection("participants").doc(nik).collection("interventions").orderBy("tanggal", "desc")
    .onSnapshot((snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
}
function subscribeSettings(cb) {
  return db.collection("settings").doc("general").onSnapshot((doc) => cb(doc.exists ? doc.data() : { povertyLine: 550458 }));
}
function subscribeParticipants(cb) {
  return db.collection("participants").orderBy("nama").onSnapshot((snap) => cb(snap.docs.map((d) => d.data())));
}

/* =====================================================================
   4) APP STATE + ROUTING
   ===================================================================== */
const params = new URLSearchParams(location.search);
const NIK_PARAM = params.get("p");
const IS_ADMIN_ROUTE = params.get("admin") === "1";

let state = {
  view: "loading",
  participant: null,
  entries: [],
  interventions: [],
  povertyLine: 550458,
  participants: [],
  incomeMap: {},
  incomeUnsubMap: {},
  saving: false,
  noteOpen: false,
  showForm: false,
  editing: null,
  confirmDelete: null,
  formError: "",
  loginError: "",
  linkCopiedNik: null,
  showInterventionForm: false,
};
let chartRef = null;
let pendingPhotoBase64 = null;

function root() { return document.getElementById("root"); }
function render() {
  root().innerHTML = viewHTML();
  drawChartIfNeeded();
}

function init() {
  if (NIK_PARAM) {
    state.view = "peserta-loading";
    render();
    track(subscribeParticipant(NIK_PARAM, (p) => {
      if (!p) { state.view = "no-access"; render(); return; }
      state.participant = p;
      state.view = "peserta";
      render();
    }));
    track(subscribeIncome(NIK_PARAM, (entries) => { state.entries = entries; if (state.view === "peserta") render(); }));
    track(subscribeInterventions(NIK_PARAM, (list) => { state.interventions = list; if (state.view === "peserta") render(); }));
    track(subscribeSettings((s) => { state.povertyLine = s.povertyLine || 550458; if (state.view === "peserta") render(); }));
    return;
  }
  if (IS_ADMIN_ROUTE) {
    auth.onAuthStateChanged((user) => {
      clearSubs();
      if (user) { state.view = "admin"; startAdminSubs(); }
      else { state.view = "admin-login"; render(); }
    });
    return;
  }
  state.view = "no-access";
  render();
}

function startAdminSubs() {
  track(subscribeSettings((s) => { state.povertyLine = s.povertyLine || 550458; render(); }));
  track(subscribeParticipants((list) => {
    state.participants = list;
    // subscribe income for any new participant not yet tracked
    list.forEach((p) => {
      if (!state.incomeUnsubMap[p.nik]) {
        state.incomeUnsubMap[p.nik] = subscribeIncome(p.nik, (entries) => {
          state.incomeMap[p.nik] = entries;
          render();
        });
      }
    });
    // cleanup listeners for removed participants
    Object.keys(state.incomeUnsubMap).forEach((nik) => {
      if (!list.find((p) => p.nik === nik)) {
        state.incomeUnsubMap[nik]();
        delete state.incomeUnsubMap[nik];
        delete state.incomeMap[nik];
      }
    });
    render();
  }));
}

/* =====================================================================
   5) ACTIONS
   ===================================================================== */
function submitIncome() {
  const val = Number(document.getElementById("incomeInput").value);
  if (!val || val < 0) { state.formError = "Masukkan jumlah pendapatan yang benar."; render(); return; }
  const catatan = state.noteOpen ? (document.getElementById("noteInput")?.value || "") : "";
  state.saving = true; state.formError = ""; render();
  addIncomeEntry(state.participant.nik, { tanggal: todayISO(), jumlah: val, catatan })
    .catch(() => { state.formError = "Gagal menyimpan. Periksa koneksi internet Anda."; })
    .finally(() => { state.saving = false; state.noteOpen = false; render(); });
}
function toggleNote() { state.noteOpen = !state.noteOpen; render(); }

function adminLogin() {
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPassword").value;
  state.loginError = "";
  auth.signInWithEmailAndPassword(email, pass).catch(() => { state.loginError = "Email atau kata sandi salah."; render(); });
}
function adminLogout() { auth.signOut().then(() => location.reload()); }

function openParticipantForm(nik) {
  state.editing = nik ? state.participants.find((p) => p.nik === nik) : null;
  pendingPhotoBase64 = state.editing ? (state.editing.fotoBase64 || null) : null;
  state.showForm = true; state.formError = "";
  render();
}
function closeParticipantForm() { state.showForm = false; state.editing = null; pendingPhotoBase64 = null; render(); }

function handlePhotoInput(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 320;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhotoBase64 = canvas.toDataURL("image/jpeg", 0.72);
      const prev = document.getElementById("photoPreview");
      if (prev) prev.src = pendingPhotoBase64;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveParticipantForm(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    nama: f.nama.value.trim(),
    nik: (state.editing ? state.editing.nik : f.nik.value.trim()),
    noTelpon: f.noTelpon.value.trim(),
    alamat: f.alamat.value.trim(),
    jumlahTanggungan: Number(f.jumlahTanggungan.value) || 0,
    jenisUsaha: f.jenisUsaha.value.trim(),
    produkUsaha: f.produkUsaha.value.trim(),
    fotoBase64: pendingPhotoBase64 || null,
  };
  if (!data.nama || !data.nik) { state.formError = "Nama dan NIK wajib diisi."; render(); return; }
  if (!/^\d+$/.test(data.nik)) { state.formError = "NIK hanya boleh berisi angka."; render(); return; }
  saveParticipantDoc(data.nik, data).then(() => {
    state.showForm = false; state.editing = null; pendingPhotoBase64 = null; render();
  }).catch(() => { state.formError = "Gagal menyimpan data peserta."; render(); });
}

function askDelete(nik) { state.confirmDelete = state.participants.find((p) => p.nik === nik); render(); }
function cancelDelete() { state.confirmDelete = null; render(); }
function confirmDeleteParticipant() {
  const nik = state.confirmDelete.nik;
  deleteParticipantDoc(nik).then(() => { state.confirmDelete = null; render(); });
}

function savePovertyLine() {
  const val = Number(document.getElementById("povertyLineInput").value);
  if (isNaN(val) || val < 0) return;
  saveSettingsDoc({ povertyLine: val });
}

function copyParticipantLink(nik) {
  const url = `${location.origin}${location.pathname}?p=${nik}`;
  navigator.clipboard.writeText(url).then(() => {
    state.linkCopiedNik = nik;
    render();
    setTimeout(() => { state.linkCopiedNik = null; render(); }, 2000);
  });
}

function goAdminDetail(nik) {
  const p = state.participants.find((x) => x.nik === nik);
  state.view = "admin-detail";
  state.participant = p;
  state.entries = state.incomeMap[nik] || [];
  state.interventions = [];
  if (state.detailInterventionUnsub) state.detailInterventionUnsub();
  state.detailInterventionUnsub = subscribeInterventions(nik, (list) => {
    state.interventions = list;
    if (state.view === "admin-detail") render();
  });
  render();
}
function backToAdmin() {
  if (state.detailInterventionUnsub) { state.detailInterventionUnsub(); state.detailInterventionUnsub = null; }
  state.view = "admin"; state.showInterventionForm = false; render();
}

function toggleInterventionForm() { state.showInterventionForm = !state.showInterventionForm; render(); }
function submitIntervention(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    tanggal: f.tanggal.value || todayISO(),
    jenis: f.jenis.value,
    keterangan: f.keterangan.value.trim(),
    nominal: f.nominal.value ? Number(f.nominal.value) : null,
  };
  addIntervention(state.participant.nik, data).then(() => { state.showInterventionForm = false; render(); });
}
function removeIntervention(id) {
  deleteIntervention(state.participant.nik, id);
}

/* ---------- ADMIN DASHBOARD ---------- */
function adminHTML() {
  const { participants, incomeMap, povertyLine } = state;
  let mandiri = 0, belumData = 0, totalGrowth = 0, growthCount = 0;
  participants.forEach((p) => {
    const entries = incomeMap[p.nik] || [];
    if (getStage(entries, p, povertyLine) === "mandiri") mandiri++;
    if (entries.length === 0) belumData++;
    const t = getTrend(entries);
    if (t.pct !== null) { totalGrowth += t.pct; growthCount++; }
  });
  const avgGrowth = growthCount ? totalGrowth / growthCount : null;

  const rows = participants.map((p) => {
    const entries = incomeMap[p.nik] || [];
    const stage = getStage(entries, p, povertyLine);
    const trend = getTrend(entries);
    const hh = householdSize(p);
    const perCapita = lastIncome(entries) / hh;
    return `<tr class="border-b border-stone-50 hover:bg-stone-50/70">
      <td class="py-2.5 pr-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full overflow-hidden bg-brand-100 flex-shrink-0 flex items-center justify-center text-brand-700 text-xs font-bold">

          <div>

      <td class="py-2.5 pr-3 font-mono text-stone-800">${rupiah(lastIncome(entries))}</td>
      <td class="py-2.5 pr-3 font-mono text-stone-800">${rupiah(perCapita)}</td>
      <td class="py-2.5 pr-3">${stageBadge(stage, true)}</td>
      <td class="py-2.5 pr-3">${trendPill(trend)}</td>
      <td class="py-2.5 pr-3">
        <div class="flex items-center gap-2">
          <button onclick="copyParticipantLink('${p.nik}')" class="text-stone-400 hover:text-brand-700 w-4 h-4" title="Salin tautan peserta">${ICON.link}</button>
          ${state.linkCopiedNik === p.nik ? `<span class="text-[10px] text-emerald-600">Disalin!</span>` : ""}
          <button onclick="openParticipantForm('${p.nik}')" class="text-stone-400 hover:text-brand-700 w-4 h-4" title="Ubah">${ICON.edit}</button>
          <button onclick="askDelete('${p.nik}')" class="text-stone-400 hover:text-rose-600 w-4 h-4" title="Hapus">${ICON.trash}</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  return `${header("Dashboard Admin")}
  <main class="max-w-5xl mx-auto px-5 py-8 pb-16">
    <div class="flex items-center justify-between mb-4">
      <span class="inline-flex items-center gap-1.5 text-xs text-emerald-600 font-medium"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Realtime aktif</span>
      <button onclick="adminLogout()" class="text-xs text-stone-400 hover:text-stone-700">Keluar</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${[
        ["Total Peserta", participants.length, "text-stone-900"],
        ["Sudah Mandiri", mandiri, "text-emerald-700"],
        ["Belum Ada Data", belumData, "text-amber-700"],
        ["Rata-rata Pertumbuhan", avgGrowth === null ? "—" : `${avgGrowth > 0 ? "+" : ""}${avgGrowth.toFixed(0)}%`, avgGrowth > 0 ? "text-emerald-700" : "text-stone-900"],
      ].map(([label, val, cls]) => `
        <div class="bg-white rounded-2xl border border-stone-200 p-5">
          <div class="text-[11px] uppercase text-stone-400 font-medium mb-1">${label}</div>
          <div class="font-display font-bold text-2xl ${cls}">${val}</div>
        </div>`).join("")}
    </div>

    <div class="bg-white rounded-2xl border border-stone-200 p-5 mb-6 flex flex-wrap items-end gap-3">
      <div class="flex-1 min-w-[220px]">
        <label class="text-xs font-medium text-stone-500 flex items-center gap-1.5 mb-1.5">
          <span class="w-3.5 h-3.5">${ICON.settings}</span> Garis Kemiskinan (per kapita / bulan)
        </label>
        <input id="povertyLineInput" type="number" value="${povertyLine}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm font-mono" />
      </div>
      <button onclick="savePovertyLine()" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Simpan Ambang</button>
      <p class="text-xs text-stone-400 basis-full flex items-start gap-1.5">
        <span class="w-3.5 h-3.5 mt-0.5 flex-shrink-0">${ICON.info}</span>

    <div class="bg-white rounded-2xl border border-stone-200 p-6">

          <span class="w-4 h-4">${ICON.plus}</span> Tambah Peserta

      ${participants.length === 0 ? `<p class="text-sm text-stone-400 py-6 text-center">Belum ada peserta terdaftar.</p>` : `
      <div class="overflow-x-auto"><table class="w-full text-sm">

  ${state.showForm ? participantFormModal() : ""}
  ${state.confirmDelete ? confirmDeleteModal() : ""}`;
}

    <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">

  </div>`;
}
function renderPhotoInline() {
  // photoPreview img src is updated directly by handlePhotoInput once canvas is ready; nothing else to do here.
}

function confirmDeleteModal() {
  const p = state.confirmDelete;
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="cancelDelete()">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full" onclick="event.stopPropagation()">
      <h3 class="font-display font-semibold text-rose-600 mb-3">Hapus Peserta?</h3>
      <p class="text-sm text-stone-600 mb-5">Data <b>${p.nama}</b> beserta seluruh histori pendapatan dan intervensinya akan dihapus permanen.</p>
      <div class="flex justify-end gap-2">
        <button onclick="cancelDelete()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>

      </div>
    </div>
  </div>`;
}

/* =====================================================================
   7) CHART
   ===================================================================== */
function drawChartIfNeeded() {
  const canvas = document.getElementById("incomeChart");
  if (!canvas) return;
  const sorted = sortedEntries(state.entries);
  const hh = householdSize(state.participant);
  if (chartRef) chartRef.destroy();
  chartRef = new Chart(canvas, {
    type: "line",
    data: {
      labels: sorted.map((_, i) => `P${i + 1}`),
      datasets: [
        { label: "Pendapatan", data: sorted.map((e) => Number(e.jumlah) || 0), borderColor: "#DD5623", backgroundColor: "#DD5623", tension: 0.3, pointRadius: 3 },
        { label: "Garis Kemiskinan", data: sorted.map(() => state.povertyLine * hh), borderColor: "#dc2626", borderDash: [4, 4], pointRadius: 0 },
      ],
    },
    options: {
      plugins: { legend: { labels: { font: { family: "Inter", size: 11 } } } },
      scales: {
        y: { ticks: { callback: (v) => (v / 1000).toFixed(0) + "k", font: { family: "JetBrains Mono", size: 10 } } },
        x: { ticks: { font: { family: "Inter", size: 11 } } },
      },
    },
  });
}

init();
</script>

<!-- =====================================================================
FIRESTORE SECURITY RULES — tempel di Firebase Console > Firestore > Rules

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /participants/{nik} {
      allow get: if true;
      allow list: if request.auth != null;
      allow write: if request.auth != null;

      match /income/{entryId} {
        allow read: if true;                    // peserta bisa lihat histori pendapatannya sendiri
        allow create: if true;                   // peserta bisa input pendapatan tanpa login
        allow update, delete: if request.auth != null;
      }

      match /interventions/{entryId} {
        allow read: if true;                     // peserta bisa lihat riwayat intervensinya sendiri
        allow write: if request.auth != null;    // hanya admin yang mencatat/menghapus intervensi
      }
    }
    match /settings/{doc} {
      allow get: if true;
      allow list: if false;
      allow write: if request.auth != null;
    }
  }
}

Catatan: "get"/"read" di path yang sudah menyertakan NIK spesifik hanya
membuka data DI BAWAH nik tersebut — bukan daftar seluruh peserta. Hanya
admin yang login yang bisa men-"list" (menampilkan semua) koleksi
participants, sehingga peserta satu tidak bisa melihat data peserta lain.
===================================================================== -->
</body>
</html>
