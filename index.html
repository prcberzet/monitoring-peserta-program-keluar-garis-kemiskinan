(function setFavicon() {
  const link = document.createElement("link");
  link.rel = "icon";
  link.type = "image/png";
  link.href = LOGO_SRC;
  document.head.appendChild(link);
})();
const rupiah = (n) => "Rp " + Math.round(n || 0).toLocaleString("id-ID");
/* Format titik ribuan saat mengetik nominal (mis. 350000 -> 350.000),
   dan parse balik ke angka murni saat data disimpan. */
function formatRibuan(raw) {
  const digits = String(raw || "").replace(/\D/g, "");
  if (!digits) return "";
  return Number(digits).toLocaleString("id-ID");
}
function unformatRibuan(str) {
  return Number(String(str || "").replace(/\D/g, "")) || 0;
}
function handleRibuanInput(input) {
  const cursorFromEnd = input.value.length - input.selectionStart;
  input.value = formatRibuan(input.value);
  const pos = Math.max(0, input.value.length - cursorFromEnd);
  input.setSelectionRange(pos, pos);
}
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
function initials(nama) {
  return (nama || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
}
function toWaNumber(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "62" + d.slice(1);
  else if (d.startsWith("62")) { /* sudah format internasional */ }
  else if (d) d = "62" + d;
  return d;
}

/* Tingkat kemandirian: dihitung dari rasio pendapatan per kapita (pendapatan
   terakhir dibagi jumlah tanggungan+1) terhadap garis kemiskinan per kapita.
   Ambang "sangat dekat dengan garis kemiskinan" dipakai 0.9x-1x GK. */
const INDEPENDENCE_LEVELS = {
  mandiri: { label: "Mandiri", bg: "bg-emerald-100", text: "text-emerald-800", dot: "bg-emerald-600" },
  aman: { label: "Aman", bg: "bg-brand-100", text: "text-brand-800", dot: "bg-brand-500" },
  rentan: { label: "Rentan", bg: "bg-amber-100", text: "text-amber-800", dot: "bg-amber-500" },
  sangat_rentan: { label: "Sangat Rentan", bg: "bg-orange-100", text: "text-orange-800", dot: "bg-orange-500" },
  menuju_keluar: { label: "Menuju Keluar GK", bg: "bg-rose-100", text: "text-rose-800", dot: "bg-rose-600" },
};
function getIndependenceLevel(entries, p, povertyLine) {
  if (!entries || entries.length === 0) return null;
  const hh = householdSize(p);
  const perCapita = referenceMonthlyIncome(entries).total / hh;
  const ratio = povertyLine > 0 ? perCapita / povertyLine : 0;
  if (ratio >= 3) return "mandiri";
  if (ratio >= 2) return "aman";
  if (ratio >= 1) return "rentan";
  if (ratio >= 0.9) return "sangat_rentan";
  return "menuju_keluar";
}
function independenceBadge(levelKey, small) {
  if (!levelKey) return `<span class="inline-flex items-center gap-1.5 rounded-full bg-stone-100 text-stone-500 font-semibold ${small ? "text-xs px-2.5 py-1" : "text-sm px-3 py-1.5"}">Belum ada data</span>`;
  const m = INDEPENDENCE_LEVELS[levelKey];
  return `<span class="inline-flex items-center gap-1.5 rounded-full ${m.bg} ${m.text} font-semibold ${small ? "text-xs px-2.5 py-1" : "text-sm px-3 py-1.5"}">
    <span class="w-1.5 h-1.5 rounded-full ${m.dot}"></span> ${m.label}</span>`;
}

/* Status sederhana: bandingkan pendapatan terakhir dengan ambang Garis
   Kemiskinan x Jumlah Tanggungan (ambang yang sama dipakai sebagai garis
   putus-putus pada grafik). */
function getPovertyStatus(entries, p, povertyLine) {
  if (!entries || entries.length === 0) return null;
  const hh = householdSize(p);
  const threshold = povertyLine * hh;
  return referenceMonthlyIncome(entries).total >= threshold ? "keluar" : "menuju";
}
const POVERTY_STATUS_META = {
  menuju: { label: "Menuju Keluar GK", bg: "bg-amber-100", text: "text-amber-800", dot: "bg-amber-500" },
  keluar: { label: "Keluar Dari Garis Kemiskinan", bg: "bg-emerald-100", text: "text-emerald-800", dot: "bg-emerald-600" },
};
function povertyStatusBadge(statusKey, small) {

function sortedEntries(entries) {
  return [...(entries || [])].sort((a, b) => a.tanggal.localeCompare(b.tanggal));
}
function sortedDesc(entries) {
  return [...(entries || [])].sort((a, b) => b.tanggal.localeCompare(a.tanggal));
}
function currentYM() {
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0");
}
function monthLabel(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
}
/* Ketentuan rentang pekan dalam sebulan (tetap, berdasarkan tanggal — bukan
   urutan input): 1-7 = Pekan 1, 8-14 = Pekan 2, 15-21 = Pekan 3, 22-31 = Pekan 4. */
function pekanOfMonth(day) {
  if (day <= 7) return 1;
  if (day <= 14) return 2;
  if (day <= 21) return 3;
  return 4;
}
/* Bulan berjalan (belum berakhir) dikelompokkan & diakumulasikan per pekan
   sesuai rentang tanggal di atas; bulan yang sudah berakhir diakumulasikan
   jadi satu total bulanan. */
function groupHistoryForDisplay(entries) {
  const sorted = sortedEntries(entries);
  const curYM = currentYM();
  const groups = {};
  sorted.forEach((e) => {
    const ym = (e.tanggal || "").slice(0, 7);
    (groups[ym] = groups[ym] || []).push(e);
  });
  const items = [];
  Object.keys(groups).sort().forEach((ym) => {
    if (ym === curYM) {
      const weekGroups = {};
      groups[ym].forEach((e) => {
        const day = Number((e.tanggal || "").slice(8, 10)) || 1;
        const wk = pekanOfMonth(day);
        (weekGroups[wk] = weekGroups[wk] || []).push(e);
      });
      Object.keys(weekGroups).sort((a, b) => Number(a) - Number(b)).forEach((wk) => {
        const list = weekGroups[wk];
        const total = list.reduce((s, e) => s + (Number(e.jumlah) || 0), 0);
        items.push({ type: "weekly", label: `Pekan ${wk}`, ym, key: `${ym}-w${wk}`, total, count: list.length, entries: list });
      });
    } else {
      const list = groups[ym];
      const total = list.reduce((s, e) => s + (Number(e.jumlah) || 0), 0);
      items.push({ type: "monthly", label: monthLabel(ym), ym, key: ym, total, count: list.length, entries: list });
    }
  });
  return items; // ascending (oldest first)
}
function householdSize(p) { return (Number(p.jumlahTanggungan) || 0) + 1; }
function lastIncome(entries) {
  const s = sortedEntries(entries);
  return s.length ? Number(s[s.length - 1].jumlah) || 0 : 0;
}
/* Acuan "Pendapatan Terakhir": total akumulasi Bulan Terakhir yang sudah
   selesai (bukan cuma entri terakhir). Kalau peserta baru mulai dan belum
   ada satu bulan pun yang selesai, dipakai akumulasi bulan berjalan sebagai
   acuan sementara. */
function referenceMonthlyIncome(entries) {
  const items = groupHistoryForDisplay(entries);
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].type === "monthly") return { total: items[i].total, label: items[i].label, complete: true };
  }
  const weekly = items.filter((it) => it.type === "weekly");
  if (weekly.length === 0) return { total: 0, label: null, complete: false };
  const total = weekly.reduce((s, it) => s + (Number(it.total) || 0), 0);
  return { total, label: monthLabel(currentYM()), complete: false };
}
function currentMonthAccumulated(entries) {
  const items = groupHistoryForDisplay(entries);
  const weekly = items.filter((it) => it.type === "weekly");
  if (weekly.length === 0) return null;
  const total = weekly.reduce((s, it) => s + (Number(it.total) || 0), 0);
  const count = weekly.reduce((s, it) => s + it.count, 0);
  return { total, label: monthLabel(currentYM()), count };
}
function getStage(entries, p, povertyLine) {
  const s = sortedEntries(entries);
  if (s.length === 0) return "baru";
  const hh = householdSize(p);
  const last4 = s.slice(-4);
  const above = last4.every((e) => (Number(e.jumlah) || 0) / hh >= povertyLine);
  if (above) return "mandiri";
  if (s.length >= 2) {
    const first = Number(s[0].jumlah) || 0;
    const last = Number(s[s.length - 1].jumlah) || 0;
    if (last > first) return "berkembang";
  }
  return "mulai";
}
function getTrend(entries) {
  const s = sortedEntries(entries);
  if (s.length < 2) return { pct: null, dir: "flat" };
  const first = Number(s[0].jumlah) || 0;
  const last = Number(s[s.length - 1].jumlah) || 0;
  if (first === 0) return { pct: null, dir: last > 0 ? "up" : "flat" };
  const pct = ((last - first) / first) * 100;
  return { pct, dir: pct > 1 ? "up" : pct < -1 ? "down" : "flat" };
}

/* Baca nominal rupiah dari sel Excel: angka biasa, "1.500.000", "Rp 750.000", atau "1500000". Kosong -> null. */
function parseRupiahCell(raw) {
  if (typeof raw === "number") return Number.isFinite(raw) && raw >= 0 ? { value: Math.round(raw) } : { error: true };
  const str = String(raw ?? "").replace(/rp\.?/gi, "").replace(/\s/g, "");
  if (str === "") return { value: null };
  const n = /^\d{1,3}(\.\d{3})+$/.test(str) ? Number(str.replace(/\./g, "")) : Number(str.replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? { value: Math.round(n) } : { error: true };
}

function buildExportRows(list, incomeMap, povertyLine, baseUrl) {
  return list.map((p) => {
    const entries = incomeMap[p.nik] || [];
    const has = entries.length > 0;
    const ref = referenceMonthlyIncome(entries);
    const hh = householdSize(p);
    const st = getPovertyStatus(entries, p, povertyLine);
    const lv = getIndependenceLevel(entries, p, povertyLine);
    const tr = getTrend(entries);
    return {
      nama: p.nama || "", nik: String(p.nik || ""), noTelpon: p.noTelpon || "", cabang: p.cabang || "", departemen: p.departemen || "",
      jumlahTanggungan: Number(p.jumlahTanggungan) || 0, jenisUsaha: p.jenisUsaha || "", produkUsaha: p.produkUsaha || "",
      baseline: p.baseline == null ? null : Number(p.baseline), alamat: p.alamat || "",
      pendapatan: has ? ref.total : null,
      bulanAcuan: has && ref.label ? (ref.complete ? ref.label : `${ref.label} (berjalan)`) : "",
      perKapita: has ? Math.round(ref.total / hh) : null,
      ambang: Math.round(povertyLine * hh),
      status: st ? POVERTY_STATUS_META[st].label : "Belum ada data",
      kemandirian: lv ? INDEPENDENCE_LEVELS[lv].label : "Belum ada data",
      tren: tr.pct === null ? null : Math.round(tr.pct * 10) / 10,
      link: `${baseUrl}?p=${p.nik}`,
    };
  });
}

async function downloadWorkbook(wb, filename) {
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

const escHtml = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function normHeader(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

function parseParticipantSheet(arrayBuffer, existingNiks) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const sheetName = wb.SheetNames.includes("Data Peserta") ? "Data Peserta" : wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: "" });
  if (aoa.length === 0) throw new Error("File Excel kosong.");

  // petakan kolom berdasarkan judul (urutan kolom bebas, tanda * diabaikan)
  const colIndex = {};
  aoa[0].forEach((h, i) => {
    const n = normHeader(h);
    const col = IMPORT_COLUMNS.find((c) => c.aliases.includes(n));
    if (col && colIndex[col.key] === undefined) colIndex[col.key] = i;
  });
  if (colIndex.nama === undefined || colIndex.nik === undefined) {
    throw new Error("Judul kolom tidak sesuai template. Pastikan kolom \"Nama Lengkap\" dan \"NIK\" ada di baris pertama (unduh ulang template jika perlu).");
  }

  const cell = (row, key) => (colIndex[key] === undefined ? "" : row[colIndex[key]]);
  const seen = new Set();
  const rows = [];
  for (let i = 1; i < aoa.length; i++) {
    const raw = aoa[i];
    if (!raw.some((v) => String(v).trim() !== "")) continue; // lewati baris kosong
    const errors = [];
    const warnings = [];

    const nama = String(cell(raw, "nama")).trim();

    const nikRaw = cell(raw, "nik");
    let nik = "";
    if (typeof nikRaw === "number") {
      if (nikRaw >= 1e15) errors.push("NIK tersimpan sebagai angka sehingga digit terakhir terpotong — ubah format kolom NIK menjadi Teks");
      nik = String(Math.round(nikRaw));
    } else {
      nik = String(nikRaw).trim();
    }
    if (!nama) errors.push("Nama kosong");
    if (!nik) errors.push("NIK kosong");
    else if (!/^\d+$/.test(nik)) errors.push("NIK harus berisi angka saja");
    else if (nik.length !== 16) warnings.push(`NIK ${nik.length} digit (umumnya 16)`);

    const tgRaw = cell(raw, "jumlahTanggungan");
    let tanggungan = 0;
    if (String(tgRaw).trim() !== "") {
      const n = Number(String(tgRaw).replace(",", "."));
      if (!Number.isFinite(n) || n < 0 || !Number.isInteger(n)) errors.push("Jumlah Tanggungan harus angka bulat ≥ 0");
      else tanggungan = n;
    }

    const cabangRaw = String(cell(raw, "cabang")).trim();
    const cabangRes = resolveCabang(cabangRaw);
    if (cabangRes === null) errors.push(`Cabang "${cabangRaw}" tidak ada di daftar — pilih dari dropdown di template`);

    const bl = parseRupiahCell(cell(raw, "baseline"));
    if (bl.error) errors.push("Baseline harus berupa angka rupiah ≥ 0 (mis. 600000)");
    const baseline = bl.error ? null : bl.value;

    if (nik && !errors.some((e) => e.startsWith("NIK"))) {
      if (seen.has(nik)) errors.push("NIK ganda di dalam file");
      seen.add(nik);
    }

    const data = {
      nama,
      nik,
      noTelpon: String(cell(raw, "noTelpon")).trim(),
      alamat: String(cell(raw, "alamat")).trim(),
      cabang: cabangRes || "",
      departemen: String(cell(raw, "departemen")).trim(),
      jumlahTanggungan: tanggungan,
      jenisUsaha: String(cell(raw, "jenisUsaha")).trim(),
      produkUsaha: String(cell(raw, "produkUsaha")).trim(),
      baseline,
    };
    const status = errors.length ? "error" : (existingNiks.has(nik) ? "exists" : "new");
    rows.push({ excelRow: i + 1, data, status, errors, warnings, tgGiven: String(tgRaw).trim() !== "" });
  }
  if (rows.length === 0) throw new Error("Tidak ada baris data peserta yang terbaca di file ini.");
  return rows;
}

function handleParticipantExcel(input) {
  const file = input.files && input.files[0];
  input.value = ""; // agar file yang sama bisa dipilih ulang
  if (!file) return;
  if (typeof XLSX === "undefined") { alert("Library Excel belum termuat. Periksa koneksi internet lalu coba lagi."); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const existing = new Set(state.participants.map((p) => p.nik));
      const rows = parseParticipantSheet(ev.target.result, existing);
      state.importPreview = { fileName: file.name, rows, updateExisting: false, importing: false, result: null, error: "" };
    } catch (err) {
      state.importPreview = { fileName: file.name, rows: [], updateExisting: false, importing: false, result: null, error: err.message || "Gagal membaca file Excel." };
    }
    render();
  };
  reader.onerror = () => { state.importPreview = { fileName: file.name, rows: [], updateExisting: false, importing: false, result: null, error: "Gagal membaca file." }; render(); };
  reader.readAsArrayBuffer(file);
}
function closeImportPreview() { state.importPreview = null; render(); }
function toggleImportUpdate(checked) { state.importPreview.updateExisting = checked; render(); }

async function runParticipantImport() {
  const pv = state.importPreview;
  if (!pv || pv.importing) return;
  const toWrite = pv.rows.filter((r) => r.status === "new" || (r.status === "exists" && pv.updateExisting));
  if (toWrite.length === 0) return;
  pv.importing = true; pv.error = ""; render();
  let created = 0, updated = 0;
  try {
    for (let i = 0; i < toWrite.length; i += 400) { // batas Firestore 500 operasi/batch
      const batch = db.batch();
      toWrite.slice(i, i + 400).forEach((r) => {
        const ref = db.collection("participants").doc(r.data.nik);
        if (r.status === "new") { batch.set(ref, { ...r.data, fotoBase64: null }); created++; }
        else {
          // perbarui hanya kolom yang terisi di Excel; sel kosong tidak menghapus data lama
          const d = Object.fromEntries(Object.entries(r.data).filter(([k, v]) => v !== "" && v !== null && (k !== "jumlahTanggungan" || r.tgGiven)));
          batch.set(ref, d, { merge: true }); updated++; // merge: foto & data lain tidak tertimpa
        }
      });
      await batch.commit();
    }
    pv.result = { created, updated, skipped: pv.rows.filter((r) => r.status === "exists").length - updated, errors: pv.rows.filter((r) => r.status === "error").length };
  } catch (err) {
    console.error("[Langkah Mandiri] Impor gagal:", err);
    pv.error = "Impor gagal sebagian/seluruhnya: " + (err && err.message ? err.message : "periksa koneksi & izin akses.");
  }
  pv.importing = false;
  render();
}
/* NIK dipakai sebagai ID dokumen di Firestore, jadi mengubah NIK berarti
   memindahkan seluruh dokumen (data peserta + histori pendapatan +
   intervensi) ke dokumen baru, lalu menghapus yang lama. Link Kartu Peserta
   yang memakai NIK lama otomatis tidak berlaku lagi setelah ini. */
async function migrateParticipantNik(oldNik, newNik, data) {
  const oldRef = db.collection("participants").doc(oldNik);
  const newRef = db.collection("participants").doc(newNik);
  const existing = await newRef.get();
  if (existing.exists) { const err = new Error("NIK sudah dipakai peserta lain."); err.code = "NIK_EXISTS"; throw err; }
  const [incomeSnap, interSnap] = await Promise.all([
    oldRef.collection("income").get(),
    oldRef.collection("interventions").get(),
  ]);
  const batch = db.batch();
  batch.set(newRef, data);
  incomeSnap.docs.forEach((d) => batch.set(newRef.collection("income").doc(d.id), d.data()));
  interSnap.docs.forEach((d) => batch.set(newRef.collection("interventions").doc(d.id), d.data()));
  incomeSnap.docs.forEach((d) => batch.delete(d.ref));
  interSnap.docs.forEach((d) => batch.delete(d.ref));
  batch.delete(oldRef);
  return batch.commit();
}
async function deleteParticipantDoc(nik) {
  const ref = db.collection("participants").doc(nik);
  const [incomeSnap, interSnap] = await Promise.all([ref.collection("income").get(), ref.collection("interventions").get()]);
  const batch = db.batch();
  incomeSnap.docs.forEach((d) => batch.delete(d.ref));
  interSnap.docs.forEach((d) => batch.delete(d.ref));
  batch.delete(ref);
  return batch.commit();
}

const NIK_PARAM = params.get("p");
const IS_ADMIN_ROUTE = params.get("admin") === "1";

let state = {
  view: "loading",
  participant: null,
  entries: [],
  interventions: [],
  povertyLine: 550458,
  participants: [],
  incomeMap: {},
  incomeUnsubMap: {},
  saving: false,
  noteOpen: false,
  showForm: false,
  editing: null,
  confirmDelete: null,
  formError: "",
  loginError: "",
  linkCopiedNik: null,
  showInterventionForm: false,
  editingIncome: null,
  expandedMonths: {},
  showPovertyModal: false,
  syncError: null,
  importPreview: null,
  filterCabang: "",
  filterDepartemen: "",
  search: "",
};
let chartRef = null;
let pendingPhotoBase64 = null;

function root() { return document.getElementById("root"); }
function render() {
  const scrollY = window.scrollY;
  const activeId = document.activeElement ? document.activeElement.id : null;
  let selStart = null, selEnd = null;
  try { selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } catch (e) {}
  root().innerHTML = viewHTML();
  drawChartIfNeeded();
  if (state.scrollToHistory) {
    state.scrollToHistory = false;
    const el = document.getElementById("historySection");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    window.scrollTo(0, scrollY);
    if (activeId) {
      const el = document.getElementById(activeId);
      if (el && el !== document.activeElement) el.focus({ preventScroll: true });
      if (el && selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function init() {
  if (NIK_PARAM) {
    state.view = "peserta-loading";
    render();
    track(subscribeParticipant(NIK_PARAM, (p) => {
      if (!p) { state.view = "no-access"; render(); return; }
      state.participant = p;
      state.view = "peserta";
      render();
    }));
    track(subscribeIncome(NIK_PARAM, (entries) => { state.entries = entries; if (state.view === "peserta") render(); }));
    track(subscribeSettings((s) => { state.povertyLine = s.povertyLine || 550458; if (state.view === "peserta") render(); }));
    return;
  }
  if (IS_ADMIN_ROUTE) {
    auth.onAuthStateChanged((user) => {
      clearSubs();
      if (user) { state.view = "admin"; startAdminSubs(); }
      else { state.view = "admin-login"; render(); }
    });
    return;
  }
  state.view = "no-access";
  render();
}

function startAdminSubs() {
  track(subscribeSettings((s) => { state.povertyLine = s.povertyLine || 550458; render(); }));
  track(subscribeParticipants((list) => {
    state.participants = list;
    // subscribe income for any new participant not yet tracked
    list.forEach((p) => {
      if (!state.incomeUnsubMap[p.nik]) {
        state.incomeUnsubMap[p.nik] = subscribeIncome(p.nik, (entries) => {
          state.incomeMap[p.nik] = entries;
          render();
        });
      }
    });
    // cleanup listeners for removed participants
    Object.keys(state.incomeUnsubMap).forEach((nik) => {
      if (!list.find((p) => p.nik === nik)) {
        state.incomeUnsubMap[nik]();
        delete state.incomeUnsubMap[nik];
        delete state.incomeMap[nik];
      }
    });
    render();
  }));
}

/* =====================================================================
   5) ACTIONS
   ===================================================================== */
function submitIncome() {
  const val = unformatRibuan(document.getElementById("incomeInput").value);
  if (!val || val < 0) { state.formError = "Masukkan jumlah pendapatan yang benar."; render(); return; }
  const catatan = state.noteOpen ? (document.getElementById("noteInput")?.value || "") : "";
  state.saving = true; state.formError = ""; render();
  addIncomeEntry(state.participant.nik, { tanggal: todayISO(), jumlah: val, catatan })
    .then(() => { state.incomeJustSaved = true; state.scrollToHistory = true; setTimeout(() => { state.incomeJustSaved = false; render(); }, 3000); })
    .catch(() => { state.formError = "Gagal menyimpan. Periksa koneksi internet Anda."; })
    .finally(() => { state.saving = false; state.noteOpen = false; render(); });
}
function toggleNote() { state.noteOpen = !state.noteOpen; render(); }

function adminLogin() {
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPassword").value;
  state.loginError = "";
  auth.signInWithEmailAndPassword(email, pass).catch(() => { state.loginError = "Email atau kata sandi salah."; render(); });
}
function adminLogout() { auth.signOut().then(() => location.reload()); }

function openParticipantForm(nik) {
  state.editing = nik ? state.participants.find((p) => p.nik === nik) : null;
  pendingPhotoBase64 = state.editing ? (state.editing.fotoBase64 || null) : null;
  state.showForm = true; state.formError = "";
  render();
}
function closeParticipantForm() { state.showForm = false; state.editing = null; pendingPhotoBase64 = null; render(); }

function handlePhotoInput(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 320;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhotoBase64 = canvas.toDataURL("image/jpeg", 0.72);
      const prev = document.getElementById("photoPreview");
      if (prev) prev.src = pendingPhotoBase64;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveParticipantForm(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    nama: f.nama.value.trim(),
    nik: f.nik.value.trim(),
    noTelpon: f.noTelpon.value.trim(),
    alamat: f.alamat.value.trim(),
    jumlahTanggungan: Number(f.jumlahTanggungan.value) || 0,
    cabang: f.cabang.value.trim(),
    departemen: f.departemen.value.trim(),
    jenisUsaha: f.jenisUsaha.value.trim(),
    produkUsaha: f.produkUsaha.value.trim(),
    baseline: f.baseline.value.trim() === "" ? null : unformatRibuan(f.baseline.value),
    fotoBase64: pendingPhotoBase64 || null,
  };
  if (!data.nama || !data.nik) { state.formError = "Nama dan NIK wajib diisi."; render(); return; }
  if (data.cabang && resolveCabang(data.cabang) === null) { state.formError = "Cabang tidak valid — pilih dari daftar."; render(); return; }
  if (!/^\d+$/.test(data.nik)) { state.formError = "NIK hanya boleh berisi angka."; render(); return; }

  const oldNik = state.editing ? state.editing.nik : null;
  if (oldNik && oldNik !== data.nik) {
    const ok = confirm(`Ubah NIK dari ${oldNik} menjadi ${data.nik}?\n\nSeluruh histori pendapatan & intervensi akan dipindahkan ke NIK baru, dan link Kartu Peserta lama (berisi NIK lama) tidak akan berlaku lagi.`);
    if (!ok) return;
    migrateParticipantNik(oldNik, data.nik, data).then(() => {
      state.showForm = false; state.editing = null; pendingPhotoBase64 = null; render();
    }).catch((err) => {
      state.formError = err && err.code === "NIK_EXISTS" ? "NIK baru sudah dipakai peserta lain." : "Gagal mengubah NIK peserta.";
      render();
    });
    return;
  }

  saveParticipantDoc(data.nik, data).then(() => {
    state.showForm = false; state.editing = null; pendingPhotoBase64 = null; render();
  }).catch(() => { state.formError = "Gagal menyimpan data peserta."; render(); });
}

function askDelete(nik) { state.confirmDelete = state.participants.find((p) => p.nik === nik); render(); }
function cancelDelete() { state.confirmDelete = null; render(); }
function confirmDeleteParticipant() {
  const nik = state.confirmDelete.nik;
  deleteParticipantDoc(nik).then(() => { state.confirmDelete = null; render(); });
}

function openPovertyLineEdit() { state.showPovertyModal = true; render(); }
function closePovertyLineEdit() { state.showPovertyModal = false; render(); }
function savePovertyLine() {
  const val = Number(document.getElementById("povertyLineInput").value);
  if (isNaN(val) || val < 0) return;
  saveSettingsDoc({ povertyLine: val });
  state.showPovertyModal = false;
  render();
}

function copyParticipantLink(nik) {
  const url = `${location.origin}${location.pathname}?p=${nik}`;
  navigator.clipboard.writeText(url).then(() => {
    state.linkCopiedNik = nik;
    render();
    setTimeout(() => { state.linkCopiedNik = null; render(); }, 2000);
  });
}

function goAdminDetail(nik) {
  const p = state.participants.find((x) => x.nik === nik);
  state.view = "admin-detail";
  state.participant = p;
  state.entries = state.incomeMap[nik] || [];
  state.interventions = [];
  if (state.detailInterventionUnsub) state.detailInterventionUnsub();
  state.detailInterventionUnsub = subscribeInterventions(nik, (list) => {
    state.interventions = list;
    if (state.view === "admin-detail") render();
  });
  render();
}
function backToAdmin() {
  if (state.detailInterventionUnsub) { state.detailInterventionUnsub(); state.detailInterventionUnsub = null; }
  state.view = "admin"; state.showInterventionForm = false; render();
}

function toggleMonthExpand(ym) {
  state.expandedMonths[ym] = !state.expandedMonths[ym];
  render();
}
function openIncomeEdit(id) {
  const entries = state.incomeMap[state.participant.nik] || [];
  state.editingIncome = entries.find((e) => e.id === id) || null;
  render();
}
function closeIncomeEdit() { state.editingIncome = null; render(); }
function submitIncomeEdit(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    tanggal: f.tanggal.value,
    jumlah: unformatRibuan(f.jumlah.value),
    catatan: f.catatan.value.trim(),
  };
  if (!data.tanggal || data.jumlah < 0) return;
  updateIncomeEntry(state.participant.nik, state.editingIncome.id, data).then(() => {
    state.editingIncome = null; render();
  });
}
function removeIncomeEntry(id) {
  if (!confirm("Hapus data pendapatan pekan ini?")) return;
  deleteIncomeEntryDoc(state.participant.nik, id);
}

function toggleInterventionForm() { state.showInterventionForm = !state.showInterventionForm; render(); }
function submitIntervention(ev) {
  ev.preventDefault();
  const f = ev.target;
  const data = {
    tanggal: f.tanggal.value || todayISO(),
    jenis: f.jenis.value,
    keterangan: f.keterangan.value.trim(),
    nominal: f.nominal.value ? Number(f.nominal.value) : null,
  };
  addIntervention(state.participant.nik, data).then(() => { state.showInterventionForm = false; render(); });
}
function removeIntervention(id) {
  deleteIntervention(state.participant.nik, id);
}

/* =====================================================================
   6) VIEWS
   ===================================================================== */
function header(showTag) {
  return `<header class="bg-white border-b border-stone-200">
    <div class="max-w-5xl mx-auto px-5 py-4 flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-white border border-brand-200 flex items-center justify-center flex-shrink-0 p-1.5 shadow-sm">
        <img src="${LOGO_SRC}" class="w-full h-full object-contain" />
      </div>
      <div>
        <h1 class="font-display font-bold text-lg text-stone-900 leading-none">Langkah Mandiri</h1>
        <p class="text-xs text-stone-400 mt-0.5">${showTag || "Monitoring pendapatan peserta pasca-bantuan usaha"}</p>
      </div>
    </div>
  </header>`;
}

function viewHTML() {
  if (state.view === "loading" || state.view === "peserta-loading") return loadingHTML();
  if (state.view === "no-access") return noAccessHTML();
  if (state.view === "peserta") return participantHTML();
  if (state.view === "admin-login") return adminLoginHTML();
  if (state.view === "admin") return adminHTML();
  if (state.view === "admin-detail") return adminDetailHTML();
  return "";
}

function loadingHTML() {
  return `<div class="min-h-screen flex items-center justify-center">
    <p class="text-sm text-stone-400">Memuat data…</p></div>`;
}

function noAccessHTML() {
  return `${header()}
  <main class="max-w-md mx-auto px-5 py-20 text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-stone-200 flex items-center justify-center text-stone-500 p-3 mb-4">${ICON.info}</div>
    <h2 class="font-display font-bold text-xl text-stone-900 mb-2">Tautan Tidak Ditemukan</h2>
    <p class="text-sm text-stone-500">Halaman ini hanya bisa diakses melalui tautan kartu pribadi yang diberikan oleh admin program. Silakan hubungi admin jika Anda belum menerima tautan Anda.</p>
    <a href="?admin=1" class="inline-block mt-8 text-xs text-stone-300 hover:text-stone-500">Admin masuk di sini</a>
  </main>`;
}

            <div class="text-sm font-semibold text-stone-800">${e.jenis}</div>

          ${canManage ? `<button onclick="removeIntervention('${e.id}')" class="text-stone-300 hover:text-rose-600 w-3.5 h-3.5 flex-shrink-0">${ICON.trash}</button>` : ""}

/* ---------- HISTORY ROWS (weekly for current month, monthly totals for past months) ---------- */
function historyRowsReadOnly(items) {
  if (items.length === 0) return `<p class="text-sm text-stone-400">Belum ada data pendapatan.</p>`;
  return [...items].reverse().map((it, i) => {
    const zebra = i % 2 === 0 ? "bg-stone-50" : "";
    if (it.count === 1) {
      const e = it.entries[0];
      return `<div class="flex items-center justify-between py-2.5 px-2 rounded-lg ${zebra}">
        <div><div class="text-sm font-medium text-stone-800">${it.label} — ${fmtDate(e.tanggal)}</div>
        ${e.catatan ? `<div class="text-xs text-stone-400">${e.catatan}</div>` : ""}</div>
        <div class="font-mono font-semibold text-stone-900 text-sm">${rupiah(e.jumlah)}</div>
      </div>`;
    }
    const expanded = !!state.expandedMonths[it.key];
    return `<div class="rounded-lg ${zebra}">
      <button onclick="toggleMonthExpand('${it.key}')" class="w-full flex items-center justify-between py-2.5 px-2 text-left">
        <div><div class="text-sm font-medium text-stone-800">${it.label}</div>
        <div class="text-xs text-stone-400">Akumulasi ${it.count} entri${it.type === "weekly" ? " pekanan" : ""} · ${expanded ? "sembunyikan rincian" : "lihat rincian"}</div></div>
        <div class="font-mono font-semibold text-stone-900 text-sm">${rupiah(it.total)}</div>
      </button>
      ${expanded ? `<div class="pl-3 pr-2 pb-2 space-y-1">
        ${[...it.entries].reverse().map((e) => `
          <div class="flex items-center justify-between py-1.5 px-2 rounded-lg bg-white border border-stone-100">
            <div><div class="text-xs font-medium text-stone-700">${fmtDate(e.tanggal)}</div>
            ${e.catatan ? `<div class="text-[11px] text-stone-400">${e.catatan}</div>` : ""}</div>
            <div class="font-mono text-xs font-semibold text-stone-800">${rupiah(e.jumlah)}</div>
          </div>`).join("")}
      </div>` : ""}
    </div>`;
  }).join("");
}

function historyRowsAdmin(items) {
  if (items.length === 0) return `<p class="text-sm text-stone-400">Belum ada data.</p>`;
  return [...items].reverse().map((it, i) => {
    const zebra = i % 2 === 0 ? "bg-stone-50" : "";
    if (it.count === 1) {
      const e = it.entries[0];
      return `<div class="flex items-center justify-between py-2.5 px-2 rounded-lg ${zebra}">
        <div><div class="text-sm font-medium text-stone-800">${it.label} — ${fmtDate(e.tanggal)}</div>
        ${e.catatan ? `<div class="text-xs text-stone-400">${e.catatan}</div>` : ""}</div>
        <div class="flex items-center gap-3">
          <div class="font-mono font-semibold text-stone-900 text-sm">${rupiah(e.jumlah)}</div>
          <button onclick="openIncomeEdit('${e.id}')" class="text-stone-400 hover:text-brand-700 w-3.5 h-3.5" title="Ubah">${ICON.edit}</button>
          <button onclick="removeIncomeEntry('${e.id}')" class="text-stone-400 hover:text-rose-600 w-3.5 h-3.5" title="Hapus">${ICON.trash}</button>
        </div>
      </div>`;
    }
    const expanded = !!state.expandedMonths[it.key];
    return `<div class="rounded-lg ${zebra}">
      <button onclick="toggleMonthExpand('${it.key}')" class="w-full flex items-center justify-between py-2.5 px-2 text-left">
        <div><div class="text-sm font-medium text-stone-800">${it.label}</div>
        <div class="text-xs text-stone-400">Akumulasi ${it.count} entri${it.type === "weekly" ? " pekanan" : ""} · ${expanded ? "sembunyikan rincian" : "lihat rincian"}</div></div>
        <div class="font-mono font-semibold text-stone-900 text-sm">${rupiah(it.total)}</div>
      </button>
      ${expanded ? `<div class="pl-3 pr-2 pb-2 space-y-1">
        ${[...it.entries].reverse().map((e) => `
          <div class="flex items-center justify-between py-1.5 px-2 rounded-lg bg-white border border-stone-100">
            <div><div class="text-xs font-medium text-stone-700">${fmtDate(e.tanggal)}</div>
            ${e.catatan ? `<div class="text-[11px] text-stone-400">${e.catatan}</div>` : ""}</div>
            <div class="flex items-center gap-2.5">
              <div class="font-mono text-xs font-semibold text-stone-800">${rupiah(e.jumlah)}</div>
              <button onclick="openIncomeEdit('${e.id}')" class="text-stone-400 hover:text-brand-700 w-3 h-3" title="Ubah">${ICON.edit}</button>
              <button onclick="removeIncomeEntry('${e.id}')" class="text-stone-400 hover:text-rose-600 w-3 h-3" title="Hapus">${ICON.trash}</button>
            </div>
          </div>`).join("")}
      </div>` : ""}
    </div>`;
  }).join("");
}

/* ---------- PARTICIPANT VIEW ---------- */
function participantHTML() {
  const p = state.participant, entries = state.entries, pl = state.povertyLine;
  const stage = getStage(entries, p, pl);
  const independenceLevel = getIndependenceLevel(entries, p, pl);
  const povertyStatus = getPovertyStatus(entries, p, pl);
  const trend = getTrend(entries);
  const monthRef = referenceMonthlyIncome(entries);
  const curMonthAcc = currentMonthAccumulated(entries);
  const sorted = sortedEntries(entries);
  const historyItems = groupHistoryForDisplay(entries);

  return `${header("Kartu Peserta Program")}
  <main class="max-w-md mx-auto px-4 sm:px-5 py-6 pb-16">

    ${state.syncError ? `<div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl px-4 py-3 mb-4">${state.syncError}</div>` : ""}

    <div class="mb-5">${identityCardHTML(p, stage, independenceLevel, povertyStatus)}</div>

    <div class="bg-white rounded-2xl border border-stone-200 p-4 mb-5">
      ${stepTrack(stage)}
    </div>

    <div class="grid grid-cols-2 gap-3 mb-5">
      <div class="rounded-xl bg-stone-100 p-4">
        <div class="text-[11px] uppercase text-stone-500 font-medium mb-1">Pendapatan Terakhir</div>
        <div class="font-mono font-bold text-lg text-stone-900">${rupiah(monthRef.total)}</div>
        ${monthRef.label ? `<div class="text-[10px] text-stone-400 mt-0.5">${monthRef.label}</div>` : `<div class="text-[10px] text-stone-400 mt-0.5">Belum ada bulan penuh</div>`}
        ${monthRef.complete && curMonthAcc ? `<div class="text-[10px] text-stone-400 mt-1 pt-1 border-t border-stone-200">Akumulasi ${curMonthAcc.label} (berjalan): ${rupiah(curMonthAcc.total)}</div>` : ""}
      </div>
      <div class="rounded-xl bg-stone-100 p-4">
        <div class="text-[11px] uppercase text-stone-500 font-medium mb-1">Tren</div>
        ${trendPill(trend)}
      </div>
    </div>

    <!-- SIMPLE INCOME FORM -->
    <div class="bg-brand-600 rounded-2xl p-5 mb-5 text-white">
      <p class="text-xs text-brand-100 mb-1">Untuk pekan ini · ${fmtDate(todayISO())}</p>
      <label class="block text-base font-semibold mb-3">Berapa pendapatan usaha Anda pekan ini?</label>
      <input id="incomeInput" type="text" inputmode="numeric" placeholder="Contoh: 350.000" oninput="handleRibuanInput(this)"
        class="w-full text-2xl font-mono font-bold text-stone-900 rounded-xl px-4 py-3.5 mb-3" />
      ${state.noteOpen ? `<input id="noteInput" type="text" placeholder="Catatan singkat (opsional)"
        class="w-full text-sm text-stone-900 rounded-xl px-4 py-2.5 mb-3" />` :
        `<button onclick="toggleNote()" class="text-xs text-brand-100 underline mb-3">+ Tambah catatan (opsional)</button>`}
      <button onclick="submitIncome()" ${state.saving ? "disabled" : ""}
        class="w-full bg-white text-brand-700 font-bold text-base rounded-xl py-3.5 disabled:opacity-60 active:scale-[0.99] transition-transform">
        ${state.saving ? "Menyimpan…" : "Simpan Pendapatan"}
      </button>
      ${state.formError ? `<p class="text-rose-100 text-xs mt-2">${state.formError}</p>` : ""}
      ${state.incomeJustSaved ? `<p class="text-white text-xs mt-2 flex items-center gap-1.5"><span class="w-3.5 h-3.5">${ICON.check}</span> Tersimpan! Lihat di Histori Pendapatan di bawah.</p>` : ""}
    </div>

    ${sorted.length > 0 ? `
    <div class="bg-white rounded-2xl border border-stone-200 p-5 mb-5">
      <h3 class="font-display font-semibold text-stone-900 mb-3">Grafik Pertumbuhan</h3>
      <div class="chart-wrap"><canvas id="incomeChart"></canvas></div>
    </div>` : ""}

    <div id="historySection" class="bg-white rounded-2xl border border-stone-200 p-5 mb-5 scroll-mt-6">
      <h3 class="font-display font-semibold text-stone-900 mb-3">Histori Pendapatan</h3>
      ${historyRowsReadOnly(historyItems)}
    </div>
  </main>`;
}

/* ---------- ADMIN LOGIN ---------- */
function adminLoginHTML() {
  return `${header("Masuk Admin")}
  <main class="max-w-sm mx-auto px-5 py-16">
    <div class="bg-white rounded-2xl border border-stone-200 p-6">
      <h2 class="font-display font-bold text-xl text-stone-900 mb-4">Masuk sebagai Admin</h2>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Email</label>
          <input id="loginEmail" type="email" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Kata Sandi</label>
          <input id="loginPassword" type="password" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>

      </div>
    </div>
  </main>`;
}

/* ---------- ADMIN DASHBOARD ---------- */
function deptBreakdownHTML(map) {
  const rows = Object.entries(map).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (!rows.length) return "";
  return `<div class="mt-3 pt-3 border-t border-stone-100 space-y-1">
    <div class="text-[10px] uppercase tracking-wide text-stone-400 mb-1">Per Departemen</div>
    ${rows.map(([k, n]) => `<div class="flex items-center justify-between gap-2 text-xs"><span class="text-stone-600 truncate" title="${escHtml(k)}">${escHtml(k)}</span><span class="font-mono font-semibold text-stone-900">${n}</span></div>`).join("")}
  </div>`;
}

function adminHTML() {
  const { participants: allParticipants, incomeMap, povertyLine } = state;
  const presentCabang = new Set(allParticipants.map((p) => String(p.cabang || "").trim()).filter(Boolean));
  const cabangOpts = [
    ...CABANG_LIST.filter((c) => presentCabang.has(c)).map((c) => ({ value: c, label: c })),
    ...[...presentCabang].filter((c) => !CABANG_LIST.includes(c)).sort().map((c) => ({ value: c, label: `⚠ ${c} (di luar daftar)` })),
  ];
  const deptOpts = distinctValues(allParticipants, "departemen");
  // filter yang nilainya sudah tidak ada lagi (mis. peserta terakhir dihapus) dikembalikan ke "Semua"
  if (state.filterCabang && state.filterCabang !== FILTER_NONE && !cabangOpts.some((o) => o.value === state.filterCabang)) state.filterCabang = "";
  if (state.filterDepartemen && state.filterDepartemen !== FILTER_NONE && !deptOpts.includes(state.filterDepartemen)) state.filterDepartemen = "";
  const { filtered: participants, shown } = applyParticipantFilters(allParticipants);
  const searchQ = state.search.trim();
  const isFiltered = !!(state.filterCabang || state.filterDepartemen);
  let diatasGK = 0, totalGrowth = 0, growthCount = 0;
  const deptTotal = {}, deptGK = {};
  const tierCounts = { mandiri: 0, aman: 0, rentan: 0, sangat_rentan: 0 };
  participants.forEach((p) => {
    const entries = incomeMap[p.nik] || [];
    const deptKey = (p.departemen || "").trim() || "(Belum diisi)";
    deptTotal[deptKey] = (deptTotal[deptKey] || 0) + 1;
    if (getPovertyStatus(entries, p, povertyLine) === "keluar") { diatasGK++; deptGK[deptKey] = (deptGK[deptKey] || 0) + 1; }
    const lvl = getIndependenceLevel(entries, p, povertyLine);
    if (lvl && Object.prototype.hasOwnProperty.call(tierCounts, lvl)) tierCounts[lvl]++;
    const t = getTrend(entries);
    if (t.pct !== null) { totalGrowth += t.pct; growthCount++; }
  });
  const avgGrowth = growthCount ? totalGrowth / growthCount : null;

  const rows = shown.map((p) => {
    const entries = incomeMap[p.nik] || [];
    const stage = getStage(entries, p, povertyLine);
    const independenceLevel = getIndependenceLevel(entries, p, povertyLine);
    const trend = getTrend(entries);
    const hh = householdSize(p);
    const monthRef = referenceMonthlyIncome(entries);
    const perCapita = monthRef.total / hh;
    return `<tr class="border-b border-stone-50 hover:bg-stone-50/70">
      <td class="py-2.5 pr-3">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full overflow-hidden bg-brand-100 flex-shrink-0 flex items-center justify-center text-brand-700 text-xs font-bold">
            ${p.fotoBase64 ? `<img src="${p.fotoBase64}" class="w-full h-full object-cover" />` : initials(p.nama)}
          </div>
          <div>
            <button onclick="goAdminDetail('${p.nik}')" class="font-medium text-brand-700 hover:underline text-left">${p.nama}</button>
            <div class="font-mono text-[11px] text-stone-400">${p.nik}</div>
          </div>
        </div>
      </td>
      <td class="py-2.5 pr-3 text-stone-600">
        <div class="text-stone-800">${escHtml(p.cabang) || "-"}</div>
        <div class="text-[11px] text-stone-400">${escHtml(p.departemen) || "-"}</div>
      </td>
      <td class="py-2.5 pr-3 text-stone-600">${p.jenisUsaha || "-"}</td>
      <td class="py-2.5 pr-3 font-mono text-stone-800">${rupiah(monthRef.total)}</td>
      <td class="py-2.5 pr-3 font-mono text-stone-800">${rupiah(perCapita)}</td>
      <td class="py-2.5 pr-3">${stageBadge(stage, true)}</td>
      <td class="py-2.5 pr-3">${independenceBadge(independenceLevel, true)}</td>
      <td class="py-2.5 pr-3">${trendPill(trend)}</td>
      <td class="py-2.5 pr-3">
        <div class="flex items-center gap-2">
          <button onclick="copyParticipantLink('${p.nik}')" class="text-stone-400 hover:text-brand-700 w-4 h-4" title="Salin tautan peserta">${ICON.link}</button>
          ${state.linkCopiedNik === p.nik ? `<span class="text-[10px] text-emerald-600">Disalin!</span>` : ""}
          <button onclick="openParticipantForm('${p.nik}')" class="text-stone-400 hover:text-brand-700 w-4 h-4" title="Ubah">${ICON.edit}</button>
          <button onclick="askDelete('${p.nik}')" class="text-stone-400 hover:text-rose-600 w-4 h-4" title="Hapus">${ICON.trash}</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  return `${header("Dashboard Admin")}
  <main class="max-w-5xl mx-auto px-5 py-8 pb-16">
    <div class="flex items-start justify-between gap-4 mb-6 flex-wrap">
      <div>
        <h2 class="font-display font-bold text-2xl text-stone-900">Dashboard Admin</h2>
        <div class="flex items-center gap-3 mt-1">
          <span class="inline-flex items-center gap-1.5 text-xs text-emerald-600 font-medium"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Realtime aktif</span>
          <button onclick="adminLogout()" class="text-xs text-stone-400 hover:text-stone-700">Keluar</button>
        </div>
      </div>
      <div class="text-right">
        <div class="text-[11px] uppercase tracking-wide text-stone-400 font-medium flex items-center justify-end gap-1.5">
          <span class="w-3 h-3">${ICON.settings}</span> Ambang Garis Kemiskinan
        </div>
        <button onclick="openPovertyLineEdit()" class="inline-flex items-center gap-2 mt-0.5 group">
          <span class="font-mono font-bold text-lg text-brand-700">${rupiah(povertyLine)}</span>
          <span class="w-3.5 h-3.5 text-stone-300 group-hover:text-brand-700">${ICON.edit}</span>
        </button>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-stone-200 px-4 py-3 mb-4 flex items-end gap-3 flex-wrap">
      <div class="text-[11px] uppercase tracking-wide text-stone-400 font-medium self-center mr-1">Filter</div>
      <div>
        <label class="text-[11px] text-stone-500 font-medium block mb-1">Cabang</label>
        <select id="filterCabang" onchange="setAdminFilter('cabang', this.value)" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm bg-white min-w-[9rem]">
          <option value="">Semua cabang</option>
          ${cabangOpts.map((o) => `<option value="${escHtml(o.value)}" ${state.filterCabang === o.value ? "selected" : ""}>${escHtml(o.label)}</option>`).join("")}
          <option value="${FILTER_NONE}" ${state.filterCabang === FILTER_NONE ? "selected" : ""}>(Belum diisi)</option>
        </select>
      </div>
      <div>
        <label class="text-[11px] text-stone-500 font-medium block mb-1">Departemen</label>
        <select id="filterDepartemen" onchange="setAdminFilter('departemen', this.value)" class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm bg-white min-w-[9rem]">
          <option value="">Semua departemen</option>
          ${deptOpts.map((v) => `<option value="${escHtml(v)}" ${state.filterDepartemen === v ? "selected" : ""}>${escHtml(v)}</option>`).join("")}
          <option value="${FILTER_NONE}" ${state.filterDepartemen === FILTER_NONE ? "selected" : ""}>(Belum diisi)</option>
        </select>
      </div>
      ${isFiltered ? `<button onclick="resetAdminFilter()" class="text-xs font-medium text-brand-700 hover:underline pb-2">Reset filter</button>` : ""}
      <div class="text-xs text-stone-400 pb-2 ml-auto">Ringkasan & tabel mengikuti filter · ${participants.length} dari ${allParticipants.length} peserta</div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${[
        ["Total Peserta", isFiltered ? `${participants.length} <span class="text-sm font-medium text-stone-400">dari ${allParticipants.length}</span>` : participants.length, "text-stone-900", deptTotal],
        ["Diatas Garis Kemiskinan", diatasGK, "text-emerald-700", deptGK],
        ["Rata-rata Pertumbuhan", avgGrowth === null ? "—" : `${avgGrowth > 0 ? "+" : ""}${avgGrowth.toFixed(0)}%`, avgGrowth > 0 ? "text-emerald-700" : "text-stone-900"],
      ].map(([label, val, cls, dept]) => `
        <div class="bg-white rounded-2xl border border-stone-200 p-5">
          <div class="text-[11px] uppercase text-stone-400 font-medium mb-1">${label}</div>
          <div class="font-display font-bold text-2xl ${cls}">${val}</div>
          ${dept ? deptBreakdownHTML(dept) : ""}
        </div>`).join("")}
      <div class="bg-white rounded-2xl border border-stone-200 p-5">
        <div class="text-[11px] uppercase text-stone-400 font-medium mb-2">Tingkat Kemandirian</div>
        <div class="space-y-1">
          ${[["mandiri", "Mandiri"], ["aman", "Aman"], ["rentan", "Rentan"], ["sangat_rentan", "Sangat Rentan"]].map(([key, label]) => `
            <div class="flex items-center justify-between text-xs">
              <span class="inline-flex items-center gap-1.5 text-stone-600"><span class="w-1.5 h-1.5 rounded-full ${INDEPENDENCE_LEVELS[key].dot}"></span> ${label}</span>
              <span class="font-mono font-semibold text-stone-900">${tierCounts[key]}</span>
            </div>`).join("")}
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-stone-200 p-6">
      <div class="flex items-start justify-between gap-3 mb-4 flex-wrap">
        <div class="flex items-center gap-3 flex-wrap">
          <h3 class="font-display font-semibold text-stone-900">Data Peserta Program</h3>
          <div class="relative w-44 sm:w-52">
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-stone-400">${ICON.search}</span>
            <input id="participantSearch" type="text" autocomplete="off" value="${escHtml(state.search)}" oninput="onParticipantSearch(this.value)"
              placeholder="Cari peserta…" aria-label="Cari peserta" title="Cari nama, NIK, telpon, cabang, departemen, usaha, atau alamat"
              class="w-full border border-stone-300 rounded-lg pl-8 ${searchQ ? "pr-7" : "pr-3"} py-1.5 text-sm" />
            ${searchQ ? `<button onclick="clearParticipantSearch()" title="Hapus pencarian" aria-label="Hapus pencarian" class="absolute right-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-stone-400 hover:text-stone-700">${ICON.x}</button>` : ""}
          </div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div class="flex items-center gap-2 flex-wrap justify-end">
            <button onclick="downloadParticipantTemplate()" title="Unduh template Excel peserta" class="inline-flex items-center gap-1 text-xs font-medium text-stone-500 hover:text-brand-700 hover:bg-stone-100 rounded-md px-2 py-1.5">
              <span class="w-3.5 h-3.5">${ICON.download}</span> Template Excel
            </button>
            <label class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand-700 bg-brand-50 border border-brand-200 hover:bg-brand-100 rounded-lg px-3 py-2 cursor-pointer">
              Upload Excel
              <input type="file" accept=".xlsx,.xls" class="hidden" onchange="handleParticipantExcel(this)" />
            </label>
            <button onclick="openParticipantForm(null)" class="inline-flex items-center gap-1.5 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg px-3.5 py-2">
              <span class="w-4 h-4">${ICON.plus}</span> Tambah Peserta
            </button>
          </div>
          <button onclick="exportParticipantsExcel()" ${shown.length === 0 ? "disabled" : ""} aria-label="Download data peserta ke Excel" title="Download ke Excel — ${shown.length} peserta yang sedang ditampilkan (mengikuti filter & pencarian)"
            class="w-9 h-9 inline-flex items-center justify-center rounded-lg border border-stone-300 bg-white text-emerald-700 hover:bg-emerald-50 hover:border-emerald-300 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white">
            <span class="w-5 h-5">${ICON.excelDownload}</span>
          </button>
        </div>
      </div>
      ${searchQ || isFiltered ? `<div class="text-xs text-stone-400 -mt-2 mb-4">Menampilkan ${shown.length} dari ${allParticipants.length} peserta${searchQ ? ` untuk “${escHtml(searchQ)}”` : ""}</div>` : ""}
      ${shown.length === 0 ? `<p class="text-sm text-stone-400 py-6 text-center">${allParticipants.length === 0 ? "Belum ada peserta terdaftar." : "Tidak ada peserta yang cocok dengan filter/pencarian."}</p>` : `
      <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="text-left text-[11px] uppercase text-stone-400 font-medium border-b border-stone-100">
          <th class="py-2 pr-3">Nama</th><th class="py-2 pr-3">Cabang / Departemen</th><th class="py-2 pr-3">Jenis Usaha</th><th class="py-2 pr-3">Pendapatan Terakhir</th>
          <th class="py-2 pr-3">Per Kapita</th><th class="py-2 pr-3">Status</th><th class="py-2 pr-3">Tingkat Kemandirian</th><th class="py-2 pr-3">Tren</th><th class="py-2 pr-3"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`}
    </div>
  </main>

  ${state.showForm ? participantFormModal() : ""}
  ${state.confirmDelete ? confirmDeleteModal() : ""}
  ${state.showPovertyModal ? povertyLineModal() : ""}
  ${state.importPreview ? importPreviewModal() : ""}`;
}

function importPreviewModal() {
  const pv = state.importPreview;
  const cnt = { new: 0, exists: 0, error: 0 };
  pv.rows.forEach((r) => cnt[r.status]++);
  const willWrite = cnt.new + (pv.updateExisting ? cnt.exists : 0);
  const badge = {
    new: `<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 rounded-full px-2 py-0.5">Baru</span>`,
    exists: `<span class="text-[11px] font-semibold ${pv.updateExisting ? "text-amber-700 bg-amber-100" : "text-stone-600 bg-stone-200"} rounded-full px-2 py-0.5">${pv.updateExisting ? "Diperbarui" : "Dilewati (sudah ada)"}</span>`,
    error: `<span class="text-[11px] font-semibold text-rose-700 bg-rose-100 rounded-full px-2 py-0.5">Error</span>`,
  };
  const close = pv.importing ? "" : "closeImportPreview()";
  let body;
  if (pv.result) {
    const r = pv.result;
    body = `<div class="rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-sm text-emerald-800 space-y-1">
        <div class="font-semibold">Impor selesai.</div>
        <div>${r.created} peserta baru ditambahkan${r.updated ? `, ${r.updated} diperbarui` : ""}${r.skipped > 0 ? `, ${r.skipped} dilewati (NIK sudah ada)` : ""}${r.errors ? `, ${r.errors} baris error tidak diimpor` : ""}.</div>
      </div>
      <div class="flex justify-end pt-3"><button onclick="closeImportPreview()" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Tutup</button></div>`;
  } else if (pv.rows.length === 0) {
    body = `<p class="text-rose-600 text-sm">${escHtml(pv.error)}</p>
      <div class="flex justify-end pt-3"><button onclick="closeImportPreview()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Tutup</button></div>`;
  } else {
    body = `<div class="grid grid-cols-3 gap-2 mb-3 text-center">
        <div class="rounded-xl bg-emerald-50 p-2.5"><div class="font-display font-bold text-xl text-emerald-700">${cnt.new}</div><div class="text-[11px] text-emerald-700">Peserta baru</div></div>
        <div class="rounded-xl bg-stone-100 p-2.5"><div class="font-display font-bold text-xl text-stone-700">${cnt.exists}</div><div class="text-[11px] text-stone-600">NIK sudah ada</div></div>
        <div class="rounded-xl bg-rose-50 p-2.5"><div class="font-display font-bold text-xl text-rose-700">${cnt.error}</div><div class="text-[11px] text-rose-700">Baris error</div></div>
      </div>
      ${cnt.exists > 0 ? `<label class="flex items-start gap-2 text-xs text-stone-600 mb-3 cursor-pointer">
        <input type="checkbox" class="mt-0.5" ${pv.updateExisting ? "checked" : ""} onchange="toggleImportUpdate(this.checked)" />
        <span>Perbarui data peserta yang NIK-nya sudah terdaftar (hanya kolom yang terisi di Excel; sel kosong tidak menghapus data lama). Foto dan histori pendapatan tidak berubah. Jika tidak dicentang, baris tersebut dilewati.</span>
      </label>` : ""}
      <div class="border border-stone-200 rounded-xl overflow-hidden mb-3">
        <div class="max-h-64 overflow-y-auto divide-y divide-stone-100">
          ${pv.rows.map((r) => `<div class="px-3 py-2 text-xs ${r.status === "error" ? "bg-rose-50/50" : ""}">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0"><span class="text-stone-400 font-mono">#${r.excelRow}</span> <span class="font-medium text-stone-800">${escHtml(r.data.nama) || "(tanpa nama)"}</span> <span class="font-mono text-stone-500">${escHtml(r.data.nik)}</span></div>
              ${badge[r.status]}
            </div>
            ${r.errors.map((e) => `<div class="text-rose-600 mt-0.5">• ${e}</div>`).join("")}
            ${r.warnings.map((w) => `<div class="text-amber-600 mt-0.5">• ${w}</div>`).join("")}
          </div>`).join("")}
        </div>
      </div>
      ${cnt.error > 0 ? `<p class="text-xs text-stone-500 mb-2">Baris error tidak akan diimpor. Perbaiki di Excel lalu upload ulang bila perlu.</p>` : ""}
      ${pv.error ? `<p class="text-rose-600 text-xs mb-2">${escHtml(pv.error)}</p>` : ""}
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeImportPreview()" ${pv.importing ? "disabled" : ""} class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg disabled:opacity-50">Batal</button>
        <button onclick="runParticipantImport()" ${pv.importing || willWrite === 0 ? "disabled" : ""} class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg disabled:opacity-50">
          ${pv.importing ? "Mengimpor…" : `Impor ${willWrite} Peserta`}
        </button>
      </div>`;
  }
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="${close}">
    <div class="bg-white rounded-2xl p-5 sm:p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-1">
        <h3 class="font-display font-semibold text-lg text-stone-900">Impor Peserta dari Excel</h3>
        <button onclick="${close}" class="text-stone-400 hover:text-stone-700 w-5 h-5">${ICON.x}</button>
      </div>
      <p class="text-xs text-stone-400 mb-4 truncate">${escHtml(pv.fileName)}</p>
      ${body}
    </div>
  </div>`;
}

    <div class="bg-white rounded-2xl border border-stone-200 p-6">

        </button>
      </div>
      ${state.showInterventionForm ? `

        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Tanggal</label>
          <input name="tanggal" type="date" value="${todayISO()}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Jenis Intervensi</label>
          <select name="jenis" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm">
            ${JENIS_INTERVENSI.map((j) => `<option value="${j}">${j}</option>`).join("")}
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="text-xs font-medium text-stone-500 block mb-1">Keterangan (opsional)</label>
          <input name="keterangan" type="text" placeholder="cth. Kaki palsu ukuran dewasa, dipasang di Klinik RZ" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Nominal Bantuan (opsional)</label>
          <input name="nominal" type="number" placeholder="cth. 2000000" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm font-mono" />
        </div>
        <div class="sm:col-span-2 flex justify-end gap-2">
          <button type="button" onclick="toggleInterventionForm()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Simpan</button>
        </div>
      </form>` : ""}
      ${interventionTimelineHTML(state.interventions, true)}
    </div>
  </main>
  ${state.editingIncome ? incomeEditModal() : ""}`;
}

function incomeEditModal() {
  const e = state.editingIncome;
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="closeIncomeEdit()">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display font-semibold text-lg text-stone-900">Ubah Data Pendapatan</h3>
        <button onclick="closeIncomeEdit()" class="text-stone-400 hover:text-stone-700 w-5 h-5">${ICON.x}</button>
      </div>
      <form onsubmit="submitIncomeEdit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Tanggal</label>
          <input name="tanggal" type="date" value="${e.tanggal}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Jumlah Pendapatan (Rp)</label>
          <input name="jumlah" type="text" inputmode="numeric" value="${formatRibuan(e.jumlah)}" oninput="handleRibuanInput(this)" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm font-mono" />
        </div>
        <div>
          <label class="text-xs font-medium text-stone-500 block mb-1">Catatan (opsional)</label>
          <input name="catatan" type="text" value="${e.catatan || ""}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeIncomeEdit()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>`;
}

function participantFormModal() {
  const ed = state.editing;
  const fields = [
    ["nama", "Nama Lengkap", "text"], ["nik", "NIK", "text"], ["noTelpon", "No. Telpon", "text"],
    ["cabang", "Cabang", "text"], ["departemen", "Departemen", "text"],
    ["jumlahTanggungan", "Jumlah Tanggungan", "number"], ["jenisUsaha", "Jenis Usaha", "text"], ["produkUsaha", "Produk Usaha", "text"],
    ["baseline", "Baseline — pendapatan terakhir sebelum intervensi bantuan", "text"],
  ];
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="closeParticipantForm()">
    <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display font-semibold text-lg text-stone-900">${ed ? "Ubah Data Peserta" : "Tambah Peserta Baru"}</h3>
        <button onclick="closeParticipantForm()" class="text-stone-400 hover:text-stone-700 w-5 h-5">${ICON.x}</button>
      </div>
      <form onsubmit="saveParticipantForm(event)" class="space-y-3">
        <datalist id="dl-departemen">${distinctValues(state.participants, "departemen").map((v) => `<option value="${escHtml(v)}"></option>`).join("")}</datalist>

        <div class="flex items-center gap-4">
          <div id="photoPreviewWrap" class="w-20 h-20 rounded-xl overflow-hidden bg-stone-100 border border-stone-200 flex-shrink-0 flex items-center justify-center">
            ${pendingPhotoBase64
              ? `<img id="photoPreview" src="${pendingPhotoBase64}" class="w-full h-full object-cover" />`
              : `<span class="w-6 h-6 text-stone-300">${ICON.camera}</span>`}
          </div>
          <div>
            <label class="text-xs font-medium text-stone-500 block mb-1">Foto Peserta</label>
            <input type="file" accept="image/*" onchange="handlePhotoInput(this); renderPhotoInline()" class="text-xs" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          ${fields.map(([key, label, type]) => {
            if (ed && key === "nik") {
              return `<div>
                <label class="text-xs font-medium text-stone-500 block mb-1">${label}</label>
                <input name="nik" type="text" inputmode="numeric" value="${ed.nik}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm font-mono" />
                <p class="text-[10px] text-amber-600 mt-1">Mengubah NIK akan memindahkan seluruh histori & membuat link Kartu Peserta lama tidak berlaku lagi.</p>
              </div>`;
            }
            if (key === "cabang") {
              const cur = ed ? resolveCabang(ed.cabang) : "";
              const legacy = ed && String(ed.cabang || "").trim() && cur === null;
              return `<div>
                <label class="text-xs font-medium text-stone-500 block mb-1">${label}</label>
                <select name="cabang" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm bg-white">
                  <option value="">— Pilih cabang —</option>
                  ${CABANG_LIST.map((c) => `<option value="${escHtml(c)}" ${cur === c ? "selected" : ""}>${escHtml(c)}</option>`).join("")}
                </select>
                ${legacy ? `<p class="text-[10px] text-amber-600 mt-1">Isian lama "${escHtml(ed.cabang)}" tidak ada di daftar — pilih cabang yang sesuai.</p>` : ""}
              </div>`;
            }
            if (key === "baseline") {
              return `<div class="col-span-2">
                <label class="text-xs font-medium text-stone-500 block mb-1">${label}</label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-stone-400">Rp</span>
                  <input name="baseline" type="text" inputmode="numeric" placeholder="Contoh: 600.000" autocomplete="off" oninput="handleRibuanInput(this)"
                    value="${ed && ed.baseline != null ? formatRibuan(ed.baseline) : ""}"
                    class="w-full border border-stone-300 rounded-lg pl-9 pr-3 py-2 text-sm font-mono" />
                </div>
                <p class="text-[10px] text-stone-400 mt-1">Pendapatan per bulan sebelum peserta menerima bantuan. Boleh dikosongkan dulu.</p>
              </div>`;
            }
            return `
            <div class="${key === "nama" || key === "produkUsaha" ? "col-span-2" : ""}">
              <label class="text-xs font-medium text-stone-500 block mb-1">${label}</label>
              <input name="${key}" type="${type}" ${key === "cabang" || key === "departemen" ? `list="dl-${key}" autocomplete="off" placeholder="Ketik atau pilih"` : ""}
                value="${escHtml(ed ? (ed[key] ?? "") : "")}"
                class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm" />
            </div>`;
          }).join("")}
          <div class="col-span-2">
            <label class="text-xs font-medium text-stone-500 block mb-1">Alamat</label>
            <textarea name="alamat" rows="2" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm">${ed ? (ed.alamat ?? "") : ""}</textarea>
          </div>
        </div>
        ${state.formError ? `<p class="text-rose-600 text-xs">${state.formError}</p>` : ""}
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeParticipantForm()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Simpan</button>
        </div>
      </form>
    </div>
  </div>`;
}
function renderPhotoInline() {
  // photoPreview img src is updated directly by handlePhotoInput once canvas is ready; nothing else to do here.
}

function povertyLineModal() {
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="closePovertyLineEdit()">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display font-semibold text-lg text-stone-900">Ubah Ambang Garis Kemiskinan</h3>
        <button onclick="closePovertyLineEdit()" class="text-stone-400 hover:text-stone-700 w-5 h-5">${ICON.x}</button>
      </div>
      <label class="text-xs font-medium text-stone-500 block mb-1">Garis Kemiskinan per kapita / bulan (Rp)</label>
      <input id="povertyLineInput" type="number" value="${state.povertyLine}" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm font-mono mb-2" />
      <p class="text-xs text-stone-400 flex items-start gap-1.5 mb-4">
        <span class="w-3.5 h-3.5 mt-0.5 flex-shrink-0">${ICON.info}</span>
        Sesuaikan dengan data Garis Kemiskinan BPS terbaru untuk wilayah program Anda. Nilai ini menjadi acuan garis kemiskinan pada grafik pertumbuhan tiap peserta.
      </p>
      <div class="flex justify-end gap-2">
        <button onclick="closePovertyLineEdit()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>
        <button onclick="savePovertyLine()" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg">Simpan</button>
      </div>
    </div>
  </div>`;
}

function confirmDeleteModal() {
  const p = state.confirmDelete;
  return `<div class="fixed inset-0 bg-stone-900/40 flex items-center justify-center p-4 z-50" onclick="cancelDelete()">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full" onclick="event.stopPropagation()">
      <h3 class="font-display font-semibold text-rose-600 mb-3">Hapus Peserta?</h3>
      <p class="text-sm text-stone-600 mb-5">Data <b>${p.nama}</b> beserta seluruh histori pendapatan dan intervensinya akan dihapus permanen.</p>
      <div class="flex justify-end gap-2">
        <button onclick="cancelDelete()" class="px-4 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Batal</button>
        <button onclick="confirmDeleteParticipant()" class="px-4 py-2 text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-lg">Hapus</button>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   7) CHART
   ===================================================================== */
function drawChartIfNeeded() {
  const canvas = document.getElementById("incomeChart");
  if (!canvas) return;
  const src = state.view === "admin-detail" ? (state.incomeMap[state.participant.nik] || []) : state.entries;
  const items = groupHistoryForDisplay(src); // bulan selesai -> total akumulasi; bulan berjalan -> per pekan
  const hh = householdSize(state.participant);
  const povertyThreshold = state.povertyLine * hh;
  if (chartRef) chartRef.destroy();
  chartRef = new Chart(canvas, {
    type: "line",
    data: {
      labels: items.map((it) => it.label),
      datasets: [
        { label: "Pendapatan", data: items.map((it) => it.total), borderColor: "#DD5623", backgroundColor: "#DD5623", tension: 0.3, pointRadius: 3 },
        { label: `Garis Kemiskinan x Tanggungan (${rupiah(povertyThreshold)})`, data: items.map(() => povertyThreshold), borderColor: "#dc2626", borderDash: [4, 4], pointRadius: 0 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { family: "Inter", size: 11 } } } },
      scales: {
        y: { ticks: { callback: (v) => (v / 1000).toFixed(0) + "k", font: { family: "JetBrains Mono", size: 10 } } },
        x: { ticks: { font: { family: "Inter", size: 11 }, maxRotation: 45, minRotation: 0 } },
      },
    },
  });
}

init();
</script>

<!-- =====================================================================
FIRESTORE SECURITY RULES — tempel di Firebase Console > Firestore > Rules

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /participants/{nik} {
      allow get: if true;
      allow list: if request.auth != null;
      allow write: if request.auth != null;

      match /income/{entryId} {
        allow read: if true;                    // peserta bisa lihat histori pendapatannya sendiri
        allow create: if true;                   // peserta bisa input pendapatan tanpa login
        allow update, delete: if request.auth != null;
      }

      match /interventions/{entryId} {
        allow read: if true;                     // peserta bisa lihat riwayat intervensinya sendiri
        allow write: if request.auth != null;    // hanya admin yang mencatat/menghapus intervensi
      }
    }
    match /settings/{doc} {
      allow get: if true;
      allow list: if false;
      allow write: if request.auth != null;
    }
  }
}

Catatan: "get"/"read" di path yang sudah menyertakan NIK spesifik hanya
membuka data DI BAWAH nik tersebut — bukan daftar seluruh peserta. Hanya
admin yang login yang bisa men-"list" (menampilkan semua) koleksi
participants, sehingga peserta satu tidak bisa melihat data peserta lain.
===================================================================== -->
</body>
